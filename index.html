<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ประกาศผลสโม 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #fff0f6, #f8c6df);
    color: #6b2145;
}

.card {
    width: 90%;
    max-width: 500px;
    padding: 35px 25px;
    text-align: center;
    background: rgba(255,255,255,0.9);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(177,62,112,0.25);
}

.heart {
    font-size: 50px;
}

h1 {
    color: #d43d82;
    margin: 10px 0;
}

.sub {
    color: #9b5276;
}

.countdown {
    font-size: 40px;
    font-weight: bold;
    color: #c72f76;
    background: #fff4f8;
    padding: 15px;
    border-radius: 18px;
    margin: 20px 0;
}

.status {
    font-weight: bold;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 15px;
    border: 2px solid #f0a5c5;
    border-radius: 14px;
    font-size: 18px;
    text-align: center;
    outline: none;
}

input:focus {
    border-color: #d83f83;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #e94d91, #c92f77);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 18px;
    font-size: 19px;
    font-weight: bold;
}

.pass {
    display: block;
    background: #ffe1ef;
    color: #b51f64;
}

.fail {
    display: block;
    background: #f3f3f3;
    color: #777;
}

.hidden {
    display: none;
}

.hint {
    margin-top: 15px;
    font-size: 13px;
    color: #a36b87;
}
</style>
</head>

<body>

<div class="card">

    <div class="heart">💗</div>

    <h1>ประกาศผลสโม</h1>

    <p class="sub">
        ตรวจสอบผลการคัดเลือกของคุณ
    </p>

    <!-- เวลานับถอยหลัง -->
    <div id="countdown" class="countdown">
        --:--:--
    </div>

    <div id="status" class="status">
        กำลังรอถึงเวลา 12:50 น.
    </div>

    <!-- ช่องกรอกหมายเลข -->
    <div id="form" class="hidden">

        <input
            id="number"
            type="text"
            inputmode="numeric"
            placeholder="กรอกหมายเลขของคุณ"
        >

        <button onclick="checkResult()">
            ตรวจสอบผลคะแนน
        </button>

        <div id="result" class="result"></div>

    </div>

    <div class="hint">
        กรุณากรอกหมายเลขของตัวเองเพื่อดูผล
    </div>

</div>


<script>

/* =====================================================
   ✏️ แก้ข้อมูลตรงนี้
   ใส่ "หมายเลขคนที่ติด" ลงไป
   ===================================================== */

const results = {

    "007": true,
    "170": true

};


/* =====================================================
   ⏰ เวลาประกาศผล
   12:40 น.
   ===================================================== */

const target = new Date();

target.setHours(12, 30, 00, 0);


/* =====================================================
   ระบบนับถอยหลัง
   ===================================================== */

function updateCountdown() {

    const now = new Date();

    const difference = target - now;

    // ถ้าถึงเวลาแล้ว
    if (difference <= 0) {

        document.getElementById("countdown").textContent =
            "เปิดแล้ว! 💗";

        document.getElementById("status").textContent =
            "สามารถตรวจสอบผลได้แล้ว";

        document.getElementById("form").classList.remove("hidden");

        return;
    }


    const hours =
        Math.floor(difference / 3600000);

    const minutes =
        Math.floor(
            (difference % 3600000) / 60000
        );

    const seconds =
        Math.floor(
            (difference % 60000) / 1000
        );


    document.getElementById("countdown").textContent =

        String(hours).padStart(2, "0")
        + ":"
        +
        String(minutes).padStart(2, "0")
        + ":"
        +
        String(seconds).padStart(2, "0");

}


/* =====================================================
   🔎 ตรวจสอบผล
   ===================================================== */

function checkResult() {

    const number =
        document.getElementById("number").value.trim();

    const result =
        document.getElementById("result");


    // ยังไม่ได้กรอก
    if (!number) {

        result.className = "result fail";

        result.textContent =
            "กรุณากรอกหมายเลขก่อนนะ 💗";

        return;
    }


    // ถ้าหมายเลขอยู่ในรายชื่อที่ติด
    if (results[number] === true) {

        result.className = "result pass";

        result.innerHTML =
            "🎉 ยินดีด้วย!<br>" +
            "คุณผ่านการคัดเลือก 💗";

    }

    // ถ้าไม่อยู่ในรายชื่อ
    else {

        result.className = "result fail";

        result.innerHTML =
            "ขอแสดงความเสียใจ<br>" +
            "หมายเลขนี้ไม่ผ่านการคัดเลือก";

    }

}


/* =====================================================
   เริ่มระบบ
   ===================================================== */

updateCountdown();

setInterval(updateCountdown, 1000);


/* กด Enter เพื่อตรวจสอบได้ */

document
    .getElementById("number")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            checkResult();

        }

    });

</script>

</body>
</html>
